server {
    listen 80 default_server;
    server_name manuel.dpl.test;
    root /var/www/estatico; # ruta DENTRO del contenedor
    index index.html;
    access_log /var/log/nginx/estatico.access.log;
    error_log /var/log/nginx/estatico.error.log;
    location / {
        try_files $uri $uri/ =404;
    }
}
